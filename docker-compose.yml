version: '3.8'
services:
  api:
    build: .
    ports:
      - "5044:8080"
    env_file:
      - .env
    volumes:
      - storage:/app/Storage
  web:
    build:
      context: ./visualsync-web
      args:
        VITE_API_URL: http://localhost:5044/api
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  storage: